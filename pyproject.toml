[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestra-forge"
version = "0.2.0"
description = "A small, modular CLI for original orchestral MIDI sketches"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Orchestra Forge contributors" }]
dependencies = []

[project.scripts]
orchestra-forge = "orchestra_forge.cli:main"

[tool.setuptools]
packages = ["orchestra_forge"]
